AWSTemplateFormatVersion: '2010-09-09'
Description: Compute stack for amznlinux-webapp-infra-lab. Creates EC2 instances, security groups, IAM role, EIP, and an additional EBS volume.

Parameters:
  ProjectName:
    Type: String
    Default: amznlinux-webapp-infra-lab
  EnvironmentName:
    Type: String
    Default: dev
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Amazon Linux 2023 AMI ID.
  InstanceType:
    Type: String
    Default: t3.micro
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  AllowedSshCidr:
    Type: String
    Description: CIDR allowed to SSH to testSV1. Use your global IP with /32.
  AllowedHttpCidr:
    Type: String
    Default: 0.0.0.0/0
  TestSV1PrivateIp:
    Type: String
    Default: 172.31.0.44
  TestSV2PrivateIp:
    Type: String
    Default: 172.31.40.44
  AdditionalVolumeSize:
    Type: Number
    Default: 8
  AdditionalVolumeType:
    Type: String
    Default: gp3
  ImageBucketName:
    Type: String
    Description: Existing S3 bucket name for image references.

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for public web server testSV1
      VpcId:
        Fn::ImportValue: !Sub ${ProjectName}-${EnvironmentName}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSshCidr
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedHttpCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-web-sg

  PrivateServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for private server testSV2
      VpcId:
        Fn::ImportValue: !Sub ${ProjectName}-${EnvironmentName}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub ${ProjectName}-${EnvironmentName}-EicEndpointSecurityGroupId
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          SourceSecurityGroupId: !Ref WebSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-private-server-sg

  Ec2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-ec2-role

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Ec2InstanceRole

  TestSV1Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref Ec2InstanceProfile
      SubnetId:
        Fn::ImportValue: !Sub ${ProjectName}-${EnvironmentName}-PublicSubnetId
      PrivateIpAddress: !Ref TestSV1PrivateIp
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          timedatectl set-timezone Asia/Tokyo
          localectl set-locale ja_JP.UTF-8
          dnf -y update || true
          dnf -y install httpd php php8.3-mysqlnd cronie mariadb105
          systemctl enable --now httpd
          systemctl enable --now php-fpm
          systemctl enable --now crond
          hostnamectl set-hostname testSV1

          cat > /var/www/html/index.html <<'HTML'
          <h1>test page: Amazon Linux 2023</h1>
          HTML

          mkdir -p /var/www/html/sampledir
          cat > /var/www/html/sampledir/test.html <<'HTML'
          <h1>test page: sampledir</h1>
          HTML

          cat > /var/www/html/s3test.html <<HTML
          <html>
          <body>
          <img src="https://${ImageBucketName}.s3.${AWS::Region}.amazonaws.com/baby.jpg"><br>
          <img src="https://${ImageBucketName}.s3.${AWS::Region}.amazonaws.com/panda.jpg"><br>
          </body>
          </html>
          HTML

          cat >> /etc/httpd/conf/httpd.conf <<APACHE
          Redirect /s3images/ https://${ImageBucketName}.s3.${AWS::Region}.amazonaws.com/
          APACHE

          cat > /var/www/html/s3test2.html <<'HTML'
          <html>
          <body>
          <img src="s3images/baby.jpg"><br>
          <img src="s3images/panda.jpg"><br>
          </body>
          </html>
          HTML

          systemctl restart httpd
      Tags:
        - Key: Name
          Value: testSV1

  TestSV2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref Ec2InstanceProfile
      SubnetId:
        Fn::ImportValue: !Sub ${ProjectName}-${EnvironmentName}-PrivateSubnet1Id
      PrivateIpAddress: !Ref TestSV2PrivateIp
      SecurityGroupIds:
        - !Ref PrivateServerSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -eux
          timedatectl set-timezone Asia/Tokyo
          localectl set-locale ja_JP.UTF-8
          dnf -y update || true
          dnf -y install mariadb105
          hostnamectl set-hostname testSV2
      Tags:
        - Key: Name
          Value: testSV2

  TestSV1ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-testsv1-eip

  TestSV1EipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt TestSV1ElasticIp.AllocationId
      InstanceId: !Ref TestSV1Instance

  AdditionalVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !GetAtt TestSV1Instance.AvailabilityZone
      Size: !Ref AdditionalVolumeSize
      VolumeType: !Ref AdditionalVolumeType
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-additional-volume

  AdditionalVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdb
      InstanceId: !Ref TestSV1Instance
      VolumeId: !Ref AdditionalVolume

Outputs:
  WebSecurityGroupId:
    Value: !Ref WebSecurityGroup
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-WebSecurityGroupId
  PrivateServerSecurityGroupId:
    Value: !Ref PrivateServerSecurityGroup
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-PrivateServerSecurityGroupId
  TestSV1InstanceId:
    Value: !Ref TestSV1Instance
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-TestSV1InstanceId
  TestSV2InstanceId:
    Value: !Ref TestSV2Instance
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-TestSV2InstanceId
  TestSV1PublicIp:
    Value: !Ref TestSV1ElasticIp
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-TestSV1PublicIp
